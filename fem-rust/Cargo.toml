[package]
name = "fullmeta-fem"
version = "2.1.0"
edition = "2024"
autobins = false

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
rivrs-sparse = { version = "0.1.1", optional = true }
serde_json = "1.0"
fullmeta-operation-contracts-sdk = { path = "../../../platform/sdk-rust/operation-contracts" }
fullmeta-core = { package = "fullmeta-core-sdk", path = "../../../platform/sdk-rust/core" }
fullmeta-model = { package = "fullmeta-model-sdk", path = "../../../platform/sdk-rust/model" }

[build-dependencies]
serde_json = "1.0"

[[bin]]
name = "fullmeta-fem"
path = "src/dispatcher.rs"

[features]
default = ["rivrs-backend", "parallel"]
rivrs-backend = ["dep:rivrs-sparse"]
parallel = ["faer/rayon"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
